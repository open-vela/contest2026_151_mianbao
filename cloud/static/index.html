<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 模拟面试官 · 对话记录</title>
<style>
  /* 全部样式内联：演示现场是手机热点，外网不一定通，不能依赖任何 CDN */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #f4f6fa;
    --card:      #ffffff;
    --line:      #e3e8f0;
    --ink:       #1c2333;
    --ink-dim:   #6b7688;
    --brand:     #2f6df6;
    --brand-dim: #eaf0ff;
    --ok:        #22c55e;
    --warn:      #f59e0b;
    --err:       #ef4444;
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
    font-size: 15px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  /* ---------- 顶栏 ---------- */
  header {
    flex: none;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: 14px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .2px;
  }
  header h1 .sub {
    color: var(--ink-dim);
    font-weight: 400;
    font-size: 13px;
    margin-left: 8px;
  }

  .badge {
    font-size: 12.5px;
    padding: 2px 10px;
    border-radius: 999px;
    background: var(--brand-dim);
    color: var(--brand);
    font-weight: 500;
    white-space: nowrap;
  }
  .badge.grey { background: #eef1f6; color: var(--ink-dim); }

  .spacer { flex: 1; }

  /* 连接状态灯 */
  .status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    color: var(--ink-dim);
    white-space: nowrap;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ink-dim);
    flex: none;
  }
  .dot.ok   { background: var(--ok);   box-shadow: 0 0 0 3px rgba(34,197,94,.16); }
  .dot.err  { background: var(--err);  box-shadow: 0 0 0 3px rgba(239,68,68,.16); }

  /* ---------- 对话区 ---------- */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 26px 22px 40px;
    scroll-behavior: smooth;
  }
  .wrap { max-width: 860px; margin: 0 auto; }

  .row {
    display: flex;
    gap: 11px;
    margin-bottom: 20px;
    align-items: flex-start;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }
  /* ⚠️ 入场动画只能挂在 .row.new 上，不能挂在 .row 上。
     挂 .row 的话，每次重绘都会让**全部**历史消息把动画重放一遍 ——
     来一条新消息，整屏对话就闪一次。所以只有"新到达的那几条"带 .new。 */
  .row.new { animation: pop .22s ease-out; }
  .row.user { flex-direction: row-reverse; }

  .avatar {
    flex: none;
    width: 32px; height: 32px;
    border-radius: 9px;
    display: grid;
    place-items: center;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    user-select: none;
  }
  .row.assistant .avatar { background: linear-gradient(135deg, #4f8bff, #2f6df6); }
  .row.user      .avatar { background: linear-gradient(135deg, #94a3b8, #64748b); }

  .bubble-col { max-width: 76%; min-width: 0; }
  .row.user .bubble-col { align-items: flex-end; display: flex; flex-direction: column; }

  .who {
    font-size: 12px;
    color: var(--ink-dim);
    margin: 0 4px 5px;
  }

  .bubble {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 11px 15px;
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: anywhere;
    box-shadow: 0 1px 2px rgba(28,35,51,.04);
  }
  .row.user .bubble {
    background: var(--brand);
    border-color: var(--brand);
    color: #fff;
  }
  .bubble strong { font-weight: 600; }
  .row.user .bubble strong { color: #fff; }

  /* ---------- 空态 / 错误 ---------- */
  .empty {
    text-align: center;
    color: var(--ink-dim);
    padding: 90px 20px;
  }
  .empty .big { font-size: 34px; margin-bottom: 14px; opacity: .5; }
  .empty h2 { font-size: 15px; font-weight: 500; margin-bottom: 8px; color: var(--ink); }
  .empty p  { font-size: 13.5px; line-height: 1.9; }
  .empty code {
    background: #eef1f6;
    padding: 1px 7px;
    border-radius: 5px;
    font-size: 12.5px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }

  /* ---------- 报告卡片（面试结束后出现） ---------- */
  /* 刻意单独放一个容器在消息流之后，而不是混进 .row 里：
     消息区走的是**增量追加**（靠 renderedCount 记到哪了），混进一个"每场只该
     出现一次"的元素，很容易在某次追加里被渲染两遍。独立容器就能每次整块重建，
     幂等、与增量逻辑完全无关。 */
  #report { display: none; }
  .report-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 18px;
    box-shadow: 0 1px 2px rgba(28,35,51,.04);
    margin-bottom: 22px;
  }
  .card-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .card-title { font-size: 15px; font-weight: 600; }
  .btn {
    font-size: 13px;
    text-decoration: none;
    color: #fff;
    background: var(--brand);
    border-radius: 9px;
    padding: 5px 13px;
    white-space: nowrap;
  }
  .btn.ghost { background: var(--brand-dim); color: var(--brand); }
  .btn:hover { filter: brightness(1.05); }
  .card-note { font-size: 12.5px; color: var(--ink-dim); margin-top: 9px; }

  /* 评分区：没有 score 字段时整段不渲染 */
  .score { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 13px; }
  .total { font-size: 13px; color: var(--ink-dim); margin-bottom: 12px; }
  .total b { font-size: 27px; color: var(--brand); font-weight: 700; margin-right: 3px; }
  .dims { display: grid; gap: 11px; }
  .dim-top { display: flex; justify-content: space-between; font-size: 13px; }
  .bar {
    height: 6px; background: #eef1f6; border-radius: 999px;
    overflow: hidden; margin-top: 4px;
  }
  /* 刻意不加 transition：卡片每次 render 都会整块重建，带动画就会反复闪。 */
  .bar i { display: block; height: 100%; background: var(--brand); border-radius: 999px; }
  .dim-comment { font-size: 12.5px; color: var(--ink-dim); margin-top: 4px; }
  .summary {
    font-size: 13px; margin-top: 12px; padding-top: 11px;
    border-top: 1px dashed var(--line);
  }
  .badge.ok { background: #e8f8ee; color: #15803d; }

  /* ---------- 顶栏的历史入口 ---------- */
  .hlink {
    font-size: 13px;
    color: var(--brand);
    text-decoration: none;
    padding: 4px 10px;
    border-radius: 8px;
    background: var(--brand-dim);
    white-space: nowrap;
  }
  .hlink:hover { filter: brightness(0.96); }

  /* ---------- 历史列表（/history） ---------- */
  /* 列表项用整块可点（<a>），不用按钮 —— 手机上整块都比小按钮好点。 */
  .sess {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 13px 16px;
    margin-bottom: 10px;
  }
  .sess:hover { border-color: var(--brand); }
  .sess-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .sess-role { font-weight: 600; font-size: 14px; }
  .sess-time { font-size: 12.5px; color: var(--ink-dim); }
  .sess-meta { font-size: 12.5px; color: var(--ink-dim); margin-left: auto; }
  .sess-score { color: var(--brand); font-weight: 600; }
  /* 首句回答是"认出自己那场"的关键 —— 公共设备上一天有十个人用过，
     时间只能定位到"大概"，得靠"我说过什么"来确认。 */
  .sess-answer {
    font-size: 13px;
    color: var(--ink);
    margin-top: 7px;
    line-height: 1.5;
    /* 最多两行，超了省略号 —— 列表项高度要整齐，扫起来才快 */
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .sess-new { font-size: 11.5px; color: #15803d; background: #e8f8ee;
              border-radius: 6px; padding: 1px 6px; }
  /* 未结束的场次在列表里多一个「结束面试」按钮。
     它是**列表项之外**的元素（挂在 .sess 旁边）—— 塞进 <a> 里既不合规，
     点按钮也会连带触发跳转。 */
  .sess-row { margin-bottom: 10px; }
  .sess-row .sess { margin-bottom: 0; }
  .sess-actions { display: flex; justify-content: flex-end; margin-top: 6px; }
  .endbtn {
    font: inherit; font-size: 12.5px; color: var(--ink-dim);
    background: #fff; border: 1px solid var(--line); border-radius: 8px;
    padding: 4px 12px; cursor: pointer;
  }
  .endbtn:hover { border-color: var(--brand); color: var(--brand); }
  .endbtn:disabled { opacity: .5; cursor: default; }

  /* ---------- 逐题复盘（报告卡片里，默认折起来） ---------- */
  /* 为什么不默认展开：10 题展开会把卡片拉得很长，而"总分 + 四个维度"才是
     第一眼要看的；复盘是"我准备细看"时才展开的东西。
     用原生 <details> —— 不需要一行 JS，也不会和卡片"整块重建"的渲染方式打架。 */
  .pq { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  .pq > summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--brand); }
  .pq[open] > summary { margin-bottom: 8px; }
  .pq-item { padding: 9px 0; border-top: 1px dashed var(--line); }
  .pq-item:first-of-type { border-top: none; padding-top: 2px; }
  .pq-q { font-size: 12.5px; color: var(--ink-dim); line-height: 1.5; }
  .pq-ev { font-size: 13px; margin-top: 5px; line-height: 1.5; }
  /* 建议是这一节里唯一"能带走"的东西，给它一点底色把它托出来 */
  .pq-sug {
    font-size: 13px;
    margin-top: 5px;
    line-height: 1.5;
    background: var(--brand-dim);
    border-radius: 8px;
    padding: 6px 9px;
  }

  /* ---------- 文字演练（/text） ---------- */
  /* 开场面板：选岗位 + 开始。 */
  .starter {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px 24px;
    max-width: 540px;
    margin: 7vh auto 0;
  }
  .starter h2 { margin: 0 0 12px; font-size: 17px; }
  /* 这段黄条是**刻意的**：文字演练不该被误当成正式用法 ——
     面试练习的核心是开口说，打字丢掉了语速、卡壳、口头语。 */
  .starter .warn {
    font-size: 13px;
    line-height: 1.65;
    color: var(--ink-dim);
    background: #fff8e8;
    border: 1px solid #f2e2c0;
    border-radius: 10px;
    padding: 10px 12px;
    margin: 0 0 18px;
  }
  .starter label { display: block; font-size: 13px; color: var(--ink-dim); margin-bottom: 18px; }
  /* 「你有一场还没结束」那一块：有未结束的场次时，开始按钮会被禁用，
     并在这里列出那几场，点进去把它结束掉。 */
  .starter .resume { margin-bottom: 20px; }
  .starter .resume h3 { margin: 0 0 6px; font-size: 14px; }
  .starter .resume p { font-size: 13px; color: var(--ink-dim); margin: 0 0 10px; line-height: 1.6; }
  .starter .sess { margin-bottom: 8px; }
  .btn:disabled, #startBtn:disabled { opacity: .45; cursor: default; }
  #answerBox:disabled { background: #f7f8fa; }
  .starter select {
    font: inherit; font-size: 14px; color: var(--ink); background: #fff;
    border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 10px; margin-left: 8px;
  }
  /* 输入条：固定在底部。**只有文字演练才显示**（见脚本里的 startText/sendText）。 */
  #composer {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: none;                      /* 显示由脚本控制：无会话/已结束时不显示 */
    gap: 10px; align-items: flex-end;
    padding: 10px 16px;
    background: rgba(255, 255, 255, .95);
    border-top: 1px solid var(--line);
  }
  #answerBox {
    flex: 1;
    font: inherit; font-size: 14px; line-height: 1.5;
    border: 1px solid var(--line); border-radius: 12px;
    padding: 9px 12px; resize: none; height: 44px; max-height: 150px;
  }
  #answerBox:focus { outline: none; border-color: var(--brand); }
  #sendBtn {
    font: inherit; font-size: 14px; color: #fff; background: var(--brand);
    border: none; border-radius: 12px; padding: 12px 20px; cursor: pointer;
    white-space: nowrap;
  }
  #sendBtn:disabled { opacity: .5; cursor: default; }
  /* 有输入条时给消息区留出底部空间，否则最后一条会被压在输入条下面 */
  body.text-mode #main { padding-bottom: 84px; }
  /* 藏掉"有新消息"按钮：它固定在右下角，会和输入条的发送按钮叠在一起 */
  body.text-mode #jump { display: none !important; }

  /* ---------- 回到底部 ---------- */
  #jump {
    position: fixed;
    right: 26px; bottom: 26px;
    background: var(--brand);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 9px 17px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 5px 16px rgba(47,109,246,.34);
    display: none;
  }
  #jump:hover { filter: brightness(1.06); }

  @media (max-width: 600px) {
    main { padding: 18px 12px 40px; }
    .bubble-col { max-width: 84%; }
    header { padding: 11px 14px; gap: 9px; }
  }
</style>
</head>
<body>

<header>
  <h1>AI 模拟面试官<span class="sub">对话记录</span></h1>
  <span class="badge grey" id="roleBadge" style="display:none"></span>
  <span class="badge" id="roundBadge" style="display:none"></span>
  <span class="badge ok" id="doneBadge" style="display:none">已结束</span>
  <!-- 详情页里的"继续对话"：这场没结束时才出现，把人带到文字演练去接着说。
       为什么需要它：从 /history 点进来落到的是**只读**的详情页（没有输入框），
       未结束的场次在这里就成了死路（2026-10-01 用户实测，台账 §11.39）。 -->
  <a class="hlink" id="continueLink" href="#" style="display:none">继续对话</a>
  <span class="spacer"></span>
  <!-- 两个入口。文字、href、显隐**都由脚本按当前视图改写**（见脚本"启动"一段）——
       三个视图共用这一个头部，任何一处写死都会在另一个视图里露馅。 -->
  <a class="hlink" id="textLink" href="/text">文字演练</a>
  <a class="hlink" id="histLink" href="/history">历史</a>
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="statusText">连接中…</span>
  </div>
</header>

<main id="main">
  <div class="wrap" id="wrap">
    <div class="empty">
      <div class="big">🎙️</div>
      <h2>等待面试开始</h2>
      <p>
        在开发板上按 <code>K1</code> 说一句话，对话会自动出现在这里。<br>
        本页只读，不会影响板子那场面试。
      </p>
    </div>
  </div>
  <!-- 报告卡片容器：面试结束后由 renderReport() 整块填充（见脚本注释） -->
  <div class="wrap" id="report"></div>
</main>

<!-- 历史列表视图（/history）。
     与上面那个 <main> 是**二选一显示**的：脚本按 location.pathname 决定露哪一个。
     刻意不复用同一个容器 —— 两者的滚动、空态、轮询行为都不一样，
     塞在一起只会让两边都变难读。 -->
<main id="hist" style="display:none">
  <div class="wrap" id="histWrap"></div>
</main>

<!-- 文字演练的开场面板（/text，还没开始时显示）：选岗位 → 开始。
     与 #main 二选一显示 —— 开始之后它就让位给消息区。 -->
<div class="wrap" id="starter" style="display:none"></div>

<!-- 文字演练的输入条（/text，面试进行中显示）。固定底部，见 CSS。 -->
<div id="composer">
  <textarea id="answerBox" rows="1"
            placeholder="在这里输入你的回答，Ctrl+Enter 发送"></textarea>
  <button id="sendBtn">发送</button>
</div>

<button id="jump">有新消息 ↓</button>

<script>
(function () {
  "use strict";

  var POLL_MS = 2000;

  var elMain   = document.getElementById("main");
  var elWrap   = document.getElementById("wrap");
  var elDot    = document.getElementById("dot");
  var elStatus = document.getElementById("statusText");
  var elRole   = document.getElementById("roleBadge");
  var elRound  = document.getElementById("roundBadge");
  var elDone   = document.getElementById("doneBadge");
  var elReport = document.getElementById("report");
  var elJump   = document.getElementById("jump");
  var elHist     = document.getElementById("hist");
  var elHistWrap = document.getElementById("histWrap");
  var elHistLink = document.getElementById("histLink");
  var elTextLink = document.getElementById("textLink");
  var elStarter  = document.getElementById("starter");
  var elComposer = document.getElementById("composer");
  var elAnswerBox = document.getElementById("answerBox");
  var elSendBtn  = document.getElementById("sendBtn");
  var elContinue = document.getElementById("continueLink");

  // ---------- 视图模式 ----------
  //
  // 同一个 HTML 文件服务四个视图，靠**真实路径 + 查询串**区分：
  //   /                  最近一场（默认，实时轮询）—— 公共设备的主路径：
  //                      面完走过来打开网页，看到的就是刚那一场
  //   /?session_id=xxx   指定某一场
  //   /history           历史列表
  //   /text              文字演练（无硬件的降级通道，见 app.py 里那个端点的注释）
  //
  // 不用前端路由（hash）而用真实路径：URL 能直接收藏/分享，刷新后停在原处 ——
  // 对"贴在板子旁边的那张纸卡上的网址"来说，这点很重要。
  var IS_LIST = /^\/history\/?$/.test(location.pathname);
  var IS_TEXT = /^\/text\/?$/.test(location.pathname);
  var SID = "";
  try { SID = new URLSearchParams(location.search).get("session_id") || ""; } catch (e) { SID = ""; }

  var lastKey     = null;  // 内容指纹：没变就整轮跳过，不做任何 DOM 操作
  var stickBottom = true;  // 用户往上翻时置 false，就不再强行拉回底部
  var curSession  = null;  // 当前正在展示的 session_id
  var renderedCount = 0;   // 已经渲染出多少条消息（用于增量追加）

  // ---------- 工具 ----------

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  // 先转义、再把 **粗体** 还原成 <strong>。顺序不能反，否则等于开了 XSS 口子。
  function fmt(s) {
    return esc(s).replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  }

  function nearBottom() {
    return elMain.scrollHeight - elMain.scrollTop - elMain.clientHeight < 80;
  }

  function setStatus(state, text) {
    elDot.className = "dot" + (state ? " " + state : "");
    elStatus.textContent = text;
  }

  function showEmpty() {
    elWrap.innerHTML =
      '<div class="empty">' +
        '<div class="big">🎙️</div>' +
        '<h2>等待面试开始</h2>' +
        '<p>在开发板上按 <code>K1</code> 说一句话，对话会自动出现在这里。<br>' +
           '本页只读，不会影响板子那场面试。</p>' +
      '</div>';
    elRole.style.display = "none";
    elRound.style.display = "none";
    elDone.style.display = "none";
    elReport.style.display = "none";
    elReport.innerHTML = "";
    curSession = null;
    renderedCount = 0;
  }

  // ---------- 报告卡片 ----------

  // 面试结束后出现的卡片：结束标识 + 下载入口 +（有的话）结构化评分。
  //
  // 报告**正文**不在这里重复渲染 —— 它就是最后那条 assistant 消息，已经在
  // 上方的气泡里了。复制一份到卡片里迟早会出现"两处不一致"，而且长文本读两遍
  // 没有意义。卡片负责的是"这场结束了"这件事，以及拿走的入口。
  function reportCard(d) {
    var sid = esc(encodeURIComponent(d.session_id || ""));
    var rounds = (d.messages || []).filter(function (m) { return m.role === "user"; }).length;
    var html =
      '<div class="report-card">' +
        '<div class="card-head">' +
          '<span class="card-title">面试报告</span>' +
          '<span class="spacer"></span>' +
          '<a class="btn" href="/api/export/' + sid + '?format=md">下载 Markdown</a>' +
          '<a class="btn ghost" href="/api/export/' + sid + '?format=json">JSON</a>' +
        '</div>' +
        '<div class="card-note">本场共 ' + rounds +
          ' 轮问答，报告正文见上方最后一条「面试官」消息。</div>';

    var s = d.score;
    if (s && s.dimensions && s.dimensions.length) {
      html += '<div class="score">';
      if (typeof s.total === "number") {
        html += '<div class="total"><b>' + esc(s.total) + '</b>/ 100</div>';
      }
      html += '<div class="dims">';
      for (var i = 0; i < s.dimensions.length; i++) {
        var dim = s.dimensions[i] || {};
        var max = dim.max || 10;
        var pct = Math.max(0, Math.min(100, (dim.score / max) * 100));
        html +=
          '<div class="dim">' +
            '<div class="dim-top"><span>' + esc(dim.name) + '</span>' +
              '<b>' + esc(dim.score) + ' / ' + esc(max) + '</b></div>' +
            '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
            (dim.comment ? '<div class="dim-comment">' + fmt(dim.comment) + '</div>' : "") +
          '</div>';
      }
      html += '</div>';
      if (s.missing && s.missing.length) {
        html += '<div class="dim-comment">本次未评：' + esc(s.missing.join("、")) + '</div>';
      }
      if (s.summary) { html += '<div class="summary">' + fmt(s.summary) + '</div>'; }
      html += '</div>';
    }

    // 逐题复盘：每题「问题 / 他的原话 / 更好的答法」，默认折起来（见 CSS 注释）。
    // 这是卡片里唯一"告诉他下一遍怎么答"的部分 —— 总分说明现状，这节才给方向。
    var pq = s && s.per_question;
    if (pq && pq.length) {
      html += '<details class="pq"><summary>逐题复盘（' + pq.length + ' 题）</summary>';
      for (var j = 0; j < pq.length; j++) {
        var q = pq[j] || {};
        html +=
          '<div class="pq-item">' +
            '<div class="pq-q">第 ' + esc(q.index) + ' 题 · ' +
              esc(q.question || "（开场）") + '</div>' +
            (q.evidence
               ? '<div class="pq-ev">你的原话：' + esc(q.evidence) + '</div>' : "") +
            (q.suggestion
               ? '<div class="pq-sug">更好的答法：' + esc(q.suggestion) + '</div>' : "") +
          '</div>';
      }
      html += '</details>';
    }

    return html + '</div>';
  }

  // 每次 render 都整块重建（幂等），与消息区的增量追加互不干扰。
  function renderReport(d) {
    // 未结束的场次：顶栏给一个「继续对话」入口。
    // 为什么要有它：详情页是**只读**的（没有输入框），从 /history 点进来的未结束
    // 场次在这里就成了死路 —— 只有从文字演练那侧进得去（用户 2026-10-01 实测）。
    if (elContinue && d.session_id) {
      elContinue.href = "/text?session_id=" + encodeURIComponent(d.session_id);
      elContinue.style.display = d.is_finished ? "none" : "";
    }

    // 文字演练里，输入条的显隐跟着"这场结束没有"走 —— 出报告之后就没什么可答的了。
    // 放在 renderReport 里而不是 render 里：它本来就在判断 is_finished。
    if (IS_TEXT && SID) {
      elComposer.style.display = d.is_finished ? "none" : "flex";
    }
    if (!d.is_finished) {
      elReport.style.display = "none";
      elReport.innerHTML = "";
      elDone.style.display = "none";
      return;
    }
    elDone.style.display = "";
    elReport.innerHTML = reportCard(d);
    // ⚠️ 这里必须是具体的 display 值，**不能写 `""`**。
    // `style.display = ""` 只是"清除行内样式"，而 `#report` 是被 CSS 里的
    // `#report { display: none }` 藏起来的 —— 清掉行内样式之后那条规则重新生效，
    // 卡片**永远显示不出来**。2026-09-30 实测踩到：报告卡片与评分区一直不渲染，
    // 而接口数据、DOM、CSS 全都是对的（见台账 §11.33）。
    // 对照：#doneBadge 那类是在 HTML 上写 `style="display:none"`，清除行内样式
    // 就能恢复默认 —— 同一个写法，隐藏方式不同，结果完全相反。
    elReport.style.display = "block";
  }

  // ---------- 渲染 ----------

  function makeRow(m, isNew) {
    var isUser = m.role === "user";
    return '<div class="row ' + (isUser ? "user" : "assistant") + (isNew ? " new" : "") + '">' +
             '<div class="avatar">' + (isUser ? "候" : "面") + "</div>" +
             '<div class="bubble-col">' +
               '<div class="who">' + (isUser ? "候选人" : "面试官") + "</div>" +
               '<div class="bubble">' + fmt(m.content) + "</div>" +
             "</div>" +
           "</div>";
  }

  function toBottom() {
    elMain.scrollTop = elMain.scrollHeight;
    stickBottom = true;
    elJump.style.display = "none";
  }

  function render(d) {
    var msgs = d.messages || [];

    if (!msgs.length) { showEmpty(); return; }

    elRole.textContent = d.role || "面试";
    elRole.style.display = "";
    var rounds = msgs.filter(function (m) { return m.role === "user"; }).length;
    elRound.textContent = "第 " + rounds + " 轮";
    elRound.style.display = "";

    // 报告卡片：独立于下面那套增量逻辑（自己整块重建，幂等）
    renderReport(d);

    var wantBottom = stickBottom || nearBottom();

    // 换了一场面试（或历史被清空/回退）：整体重建，这批不播入场动画
    if (d.session_id !== curSession || msgs.length < renderedCount) {
      var html = "";
      for (var i = 0; i < msgs.length; i++) { html += makeRow(msgs[i], false); }
      elWrap.innerHTML = html;
      renderedCount = msgs.length;
      curSession = d.session_id;
      toBottom();
      return;
    }

    // 常见情况：只多了几条。只渲染新增的，且只给它们播入场动画。
    // 这样已有的对话不会重绘，也就不会闪。
    if (msgs.length > renderedCount) {
      // 先摘掉上一批的 .new，让这个类始终只代表"本次刚到的"。
      // （此刻不摘也不会重放动画 —— insertAdjacentHTML 不重解析已有节点 ——
      //  但标记会一批批堆积，将来谁写了依赖 .row.new 的样式就会中招。）
      // ⚠️ 不能用 elWrap.innerHTML = ...replace(...) 来清：那样会把所有节点
      //    重建一遍，反而让**全部**历史消息的动画重放 —— 正是要避免的闪。
      var olds = elWrap.querySelectorAll(".row.new");
      for (var k = 0; k < olds.length; k++) { olds[k].classList.remove("new"); }

      var frag = "";
      for (var j = renderedCount; j < msgs.length; j++) { frag += makeRow(msgs[j], true); }
      elWrap.insertAdjacentHTML("beforeend", frag);
      renderedCount = msgs.length;
      // 同 elReport：`#jump` 也是被 CSS 藏起来的，必须给具体值。
      // 这个 bug 比报告卡片更早 —— "有新消息 ↓"按钮从写出来那天起就没显示过。
      if (wantBottom) { toBottom(); } else { elJump.style.display = "inline-block"; }
    }
  }

  // ---------- 轮询 ----------

  // 每次 tick 领一个序号：**只有最新那次的结果才允许落地**。
  //
  // 为什么需要：轮询（2 秒一次）与"发完消息立刻刷新"会并发。若旧的轮询响应后到，
  // 它渲染的是旧状态 —— 新发的那条就"没显示"，要等下一轮才补上（用户实测遇到过：
  // "发了一条消息却直接没显示"，2026-10-01）。
  var tickSeq = 0;

  function tick() {
    var seq = ++tickSeq;
    fetch("/api/history" + (SID ? "?session_id=" + encodeURIComponent(SID) : ""),
          { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) { throw new Error("HTTP " + r.status); }
        return r.json();
      })
      .then(function (d) {
        if (seq !== tickSeq) { return; }     // 旧的响应晚到了 —— 丢掉，别拿它覆盖新的
        setStatus("ok", "已连接");

        // 指纹：消息条数 + 最后一条内容 + 结束标志 + 评分状态，全没变就不重绘。
        //
        // ⚠️ `is_finished` 和评分状态**必须**进指纹：消息条数与内容都相同时，
        // 这两样仍可能变 —— 评分是后台线程算完才回填的（报告落库在先、评分在后），
        // 只按消息算指纹的话，评分永远等不到那次重绘。全都不变才跳过。
        var msgs = d.messages || [];
        var last = msgs.length ? msgs[msgs.length - 1] : null;
        var score = d.score || null;
        var key  = d.session_id + "|" + msgs.length + "|" + (last ? last.content : "") +
                   "|" + (d.is_finished ? "1" : "0") +
                   "|" + (score ? (score.status + score.total + (score.dimensions || []).length) : "");
        if (key === lastKey) { return; }
        lastKey = key;

        if (d.waiting) { showEmpty(); return; }
        render(d);
      })
      .catch(function (e) {
        if (seq !== tickSeq) { return; }     // 同上：过期的失败不该覆盖当前状态
        setStatus("err", "连接中断（" + e.message + "）");
      });
  }

  // 用户手动往上翻 -> 停止自动跟随；滚回底部 -> 恢复
  elMain.addEventListener("scroll", function () {
    if (nearBottom()) {
      stickBottom = true;
      elJump.style.display = "none";
    } else {
      stickBottom = false;
    }
  });

  elJump.addEventListener("click", function () {
    stickBottom = true;
    elMain.scrollTop = elMain.scrollHeight;
    elJump.style.display = "none";
  });

  // ---------- 历史列表（/history） ----------

  function fmtTime(ts) {
    if (!ts) { return ""; }
    var d = new Date(ts * 1000);
    var pad = function (n) { return (n < 10 ? "0" : "") + n; };
    var hm = pad(d.getHours()) + ":" + pad(d.getMinutes());
    var today = new Date();
    if (d.toDateString() === today.toDateString()) { return "今天 " + hm; }
    if (d.toDateString() === new Date(today.getTime() - 86400000).toDateString()) {
      return "昨天 " + hm;
    }
    return (d.getMonth() + 1) + "月" + d.getDate() + "日 " + hm;
  }

  // 一条场次记录（历史列表与文字演练的"未结束"列表共用）。
  // `base` 是点进去之后落到哪个视图：历史里落到 `/`，文字演练里落到 `/text`。
  // `withEnd` 为真且这场没结束时，右边多一个「结束面试」按钮。
  function sessItem(s, base, withEnd) {
    var link = sessLink(s, base);
    if (!withEnd || s.is_finished) { return link; }
    return '<div class="sess-row">' + link +
      '<div class="sess-actions">' +
        '<button class="endbtn" data-sid="' + esc(s.session_id || "") +
          '">结束面试</button>' +
      "</div></div>";
  }

  function sessLink(s, base) {
    return '<a class="sess" href="' + base + "?session_id=" +
        esc(encodeURIComponent(s.session_id || "")) + '">' +
      '<div class="sess-top">' +
        '<span class="sess-role">' + esc(s.role || "面试") + '</span>' +
        '<span class="sess-time">' +
          esc(fmtTime(s.updated_at || s.created_at || s.mtime)) + '</span>' +
        '<span class="sess-meta">' + esc(s.rounds || 0) + ' 轮' +
          (s.is_finished ? "" : ' · <span class="sess-new">进行中</span>') +
          (typeof s.score_total === "number"
             ? ' · <span class="sess-score">' + esc(s.score_total) + ' 分</span>'
             : "") +
        '</span>' +
      '</div>' +
      (s.first_answer
         ? '<div class="sess-answer">' + esc(s.first_answer) + '</div>'
         : "") +
    '</a>';
  }

  function renderList(items) {
    if (!items.length) {
      elHistWrap.innerHTML =
        '<div class="empty">' +
          '<div class="big">📭</div>' +
          '<h2>还没有面试记录</h2>' +
          '<p>在开发板上按 <code>K1</code> 说一句话，这一场结束后就会出现在这里。</p>' +
        '</div>';
      return;
    }
    var html = "";
    for (var i = 0; i < items.length; i++) {
      html += sessItem(items[i] || {}, "/", true);
    }
    elHistWrap.innerHTML = html;
  }

  function loadList() {
    fetch("/api/sessions?limit=20", { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) { throw new Error("HTTP " + r.status); }
        return r.json();
      })
      .then(function (d) {
        setStatus("ok", "已连接");
        renderList(d.sessions || []);
      })
      .catch(function (e) { setStatus("err", "连接中断（" + e.message + "）"); });
  }

  // ---------- 文字演练（/text） ----------
  //
  // 无硬件的降级通道：打字代替说话，**不走 TTS**（每轮省掉两次语音调用）。
  // 每一步都落在与设备链路**同一个会话机制**上 —— 所以它产生的记录，在 /history
  // 里和板子那几场并列，报告、评分、逐题复盘一模一样。

  // 岗位清单：必须与题库里的 6 个岗位名**一字不差** —— 对不上时云端不报错，
  // 只会静默退化成"没有参考题的自由提问"（见 cloud/question_bank.py 的别名表）。
  var ROLES = ["AI 应用开发", "AI Agent 开发", "大模型算法工程师",
               "AI/ML Engineer", "Data Scientist", "Data Analyst"];

  var textRole = ROLES[0];
  var starting = false;

  function renderStarter(unfinished) {
    var i, opts = "";
    for (i = 0; i < ROLES.length; i++) {
      opts += '<option value="' + esc(ROLES[i]) + '">' + esc(ROLES[i]) + "</option>";
    }

    var html = '<div class="starter"><h2>文字演练</h2>' +
      '<p class="warn">这是<b>无硬件的降级演练</b>：打字练不出语速、卡壳和口头语 ——' +
        "正式使用请对着开发板说。</p>";

    // ⚠️ 有未结束的场次时**不许开新的一场**（用户 2026-10-01 提的规则）。
    // 第一版的教训很具体：开新的一场会再造一个"进行中"的会话，而输入口只长在
    // 那一场自己的页面上 —— 走开就再也找不回来，于是记录里堆着一堆半截面试，
    // 连结束都没法结束。
    if (unfinished.length) {
      html += '<div class="resume"><h3>你有一场还没结束</h3>' +
              "<p>先打开它、说一句「结束吧」把它收尾，才能开始新的一场。</p>";
      for (i = 0; i < unfinished.length; i++) {
        html += sessItem(unfinished[i], "/text", true);
      }
      html += "</div>";
    }

    html += '<label>面试岗位 <select id="roleSel">' + opts + "</select></label>" +
      '<button class="btn" id="startBtn" style="font-size:14px;padding:9px 18px"' +
      (unfinished.length ? " disabled" : "") + ">开始面试</button></div>";

    elStarter.innerHTML = html;
    if (!unfinished.length) {
      document.getElementById("startBtn").addEventListener("click", startText);
    }
  }

  function loadStarter() {
    fetch("/api/sessions?limit=20", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var unfinished = (d.sessions || []).filter(function (s) { return !s.is_finished; });
        renderStarter(unfinished);
      })
      .catch(function () {
        // 列表拿不到**不能挡住"开始"** —— 那会让文字演练在云端抽风时彻底用不了。
        renderStarter([]);
      });
  }

  function textPost(payload) {
    return fetch("/api/interview/text", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json(); });
  }

  function startText() {
    if (starting) { return; }          // 防连点：点两下会开出两场会话
    starting = true;
    var btn = document.getElementById("startBtn");
    var sel = document.getElementById("roleSel");
    textRole = sel ? sel.value : ROLES[0];
    if (btn) { btn.disabled = true; btn.textContent = "正在准备…"; }
    // ⚠️ 即时反馈：这一下要等 LLM（一两秒）。不给任何反馈，用户的感觉就是"卡住了"
    //    —— 这是 2026-10-01 用户报的第一个问题，延迟本身是模型的，不是我们的。
    setStatus("ok", "面试官正在准备…");
    textPost({ role: textRole, state: "start" })
      .then(function (d) {
        if (!d.session_id) { throw new Error(d.error || "创建会话失败"); }
        SID = d.session_id;
        elStarter.style.display = "none";
        // ⚠️ 必须把消息区**恢复显示**：开场页那一步把它藏起来了（为了只显示开场面板），
        // 忘了恢复的话，消息会照常渲染进一个看不见的容器 —— 表现为"开场白看不见，
        // 退出重进才有"（2026-10-01 用户实测，台账 §11.39）。
        elMain.style.display = "";
        elComposer.style.display = "flex";
        // 会话写进地址栏：刷新还停在这一场（与另外两个视图同一个规矩）
        history.replaceState(null, "", "/text?session_id=" + encodeURIComponent(SID));
        tick();
        elAnswerBox.focus();
      })
      .catch(function (e) {
        setStatus("err", e.message);
        if (btn) { btn.disabled = false; btn.textContent = "开始面试"; }
      })
      .then(function () { starting = false; });
  }

  function sendText() {
    var text = (elAnswerBox.value || "").trim();
    if (!text || !SID || elSendBtn.disabled) { return; }
    elSendBtn.disabled = true;
    elAnswerBox.disabled = true;
    setStatus("ok", "面试官正在思考…");   // 同上：等待期间必须让用户看到"它在动"
    textPost({ session_id: SID, role: textRole, text: text })
      .then(function (d) {
        if (d.error) { throw new Error(d.error); }
        elAnswerBox.value = "";
        tick();                        // 立刻拉一次，不必等下一轮轮询
      })
      .catch(function (e) { setStatus("err", e.message); })
      .then(function () {
        elSendBtn.disabled = false;
        elAnswerBox.disabled = false;
        elAnswerBox.focus();
      });
  }

  // Ctrl/⌘+Enter 发送（与 myagent 的习惯一致）；单独 Enter 换行，不打字误发。
  elAnswerBox.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      sendText();
    }
  });
  elSendBtn.addEventListener("click", sendText);

  // ---------- 列表里的「结束面试」 ----------
  //
  // 效果与**在对话里输入"结束面试"完全相同** —— 走同一个端点、同一段判据
  // （finish_guard 的白名单里本来就有"结束面试"）。所以那一轮照常留下记录、
  // 照常出报告与评分，不是"从后台偷偷抹掉"。

  function endSession(sessionId, btn) {
    if (!sessionId) { return; }
    if (btn) { btn.disabled = true; btn.textContent = "正在收尾…"; }
    fetch("/api/interview/text", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, text: "结束面试" })
    }).then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.error) { throw new Error(d.error); }
        setStatus("ok", "已结束");
        refreshCurrentView();
      })
      .catch(function (e) {
        setStatus("err", e.message);
        if (btn) { btn.disabled = false; btn.textContent = "结束面试"; }
      });
  }

  function refreshCurrentView() {
    if (IS_LIST) { loadList(); }
    else if (IS_TEXT) { if (SID) { tick(); } else { loadStarter(); } }
    else { loadStarter(); }
  }

  // 事件委托：这两处列表都是整块 innerHTML 重建的，逐个绑定会在每次刷新后失效。
  function onEndClick(e) {
    var btn = e.target && e.target.closest ? e.target.closest(".endbtn") : null;
    if (!btn) { return; }
    e.preventDefault();
    endSession(btn.getAttribute("data-sid"), btn);
  }
  elHistWrap.addEventListener("click", onEndClick);
  elStarter.addEventListener("click", onEndClick);

  // ---------- 启动 ----------

  if (IS_LIST) {
    // 列表模式下不启动对话轮询：那个 tick 会去拉"最近一场"并渲染对话，
    // 和列表抢同一个页面。两个视图二选一，是这里最省事也最不容易出错的划分。
    elMain.style.display = "none";
    elHist.style.display = "";
    elHistLink.textContent = "← 当前面试";
    elHistLink.href = "/";
    loadList();
    // 5 秒一次：别人刚面完，过来看列表的人应该能立刻看到它。
    // 一次请求只是一次目录扫描（见 session_store.list_summaries 的注释）。
    setInterval(loadList, 5000);
  } else if (IS_TEXT) {
    document.body.className = "text-mode";
    elTextLink.textContent = "← 对话记录";
    elTextLink.href = "/";
    if (SID) {
      // 刷新回来，或从历史里点进来：直接接着这一场说
      elComposer.style.display = "flex";
      tick();
      setInterval(tick, POLL_MS);   // 评分是后台算的，得轮询才看得到它出现
    } else {
      elMain.style.display = "none";   // 还没开始：只显示开场面板
      loadStarter();
      elStarter.style.display = "";
    }
  } else {
    elHistLink.textContent = SID ? "← 历史" : "历史";
    tick();
    setInterval(tick, POLL_MS);
  }
})();
</script>

</body>
</html>
